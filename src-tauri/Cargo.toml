[package]
name = "paperai"
version = "0.5.1"
description = "PaperAI — Read · Annotate · Ask (Windows PDF reader)"
authors = ["PaperAI"]
edition = "2021"

[lib]
name = "paperai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-dialog = "2.8.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22"
sha2 = "0.10"

# --- AI layer -------------------------------------------------------------
# Async HTTP with streaming. `rustls-tls` keeps TLS verification on by default
# and avoids depending on the machine's OpenSSL; we never disable verification.
reqwest = { version = "0.12.24", default-features = false, features = [
    "stream",
    "json",
    "rustls-tls",
] }
tokio = { version = "1.48.0", features = ["rt", "sync", "time", "macros"] }
futures-util = "0.3.31"
uuid = { version = "1.18.1", features = ["v4"] }

# Windows Credential Manager for API keys. Explicitly scoped by feature so the
# crate stays out of non-Windows builds.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

[profile.release]
# LTO left off deliberately: it roughly quadruples build time and this is a
# PoC. Enable for a real shipping build.
codegen-units = 16
opt-level = "s"
panic = "abort"
strip = true
